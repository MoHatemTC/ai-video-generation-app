<div class="paper-inner">

  <div class="logo-row">
    <svg viewBox="0 0 40 40" fill="none">
      <path d="M14 6 L4 34" stroke="var(--c1, #2563eb)" stroke-width="7" stroke-linecap="round"/>
      <path d="M26 6 L16 34" stroke="var(--c1, #2563eb)" stroke-width="7" stroke-linecap="round"/>
      <path d="M36 6 L26 34" stroke="var(--c1, #2563eb)" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">Sprints</span>
  </div>

  <div class="middle-row">
    <div class="left-title">
      {{ plan.title or scene.text }}
    </div>

    <div class="cloud-wrap">
      <svg viewBox="0 0 340 260" fill="none">
        <path d="M55 150
                 C30 148 18 128 30 112
                 C20 96 34 74 58 76
                 C60 52 88 36 112 48
                 C122 26 158 22 176 40
                 C200 22 234 30 240 54
                 C266 50 288 70 282 92
                 C304 98 308 126 288 138
                 C296 158 276 176 254 170
                 C250 192 220 202 200 188
                 C186 206 152 206 140 188
                 C114 202 82 190 82 168
                 C64 172 48 164 55 150 Z"
          stroke="var(--c1, #374151)" stroke-width="3.5" stroke-linejoin="round" fill="rgba(255,255,255,0.7)"/>
      </svg>
      <div class="cloud-content">
        {% set hero_cue = scene.visual_cues[0] if scene.visual_cues else None %}
        {% if hero_cue and hero_cue.asset_url %}
          <img src="{{ hero_cue.asset_url | safe }}" alt="Hero Icon" class="cue-asset float" style="width:70px; height:70px; object-fit:contain;" />
        {% else %}
          <div class="emoji">🔒</div>
        {% endif %}
        <div class="word">{{ plan.title.split(' ')[-1] if plan.title else "Intro" }}</div>
      </div>
    </div>
  </div>

  <div class="bottom-row">
    <svg viewBox="0 0 150 70" fill="none">
      <path d="M6 8 C20 40 60 58 130 56" stroke="var(--c1, #2563eb)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M112 44 L134 57 L110 66" stroke="var(--c1, #2563eb)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="bottom-label">Let's Get Started</div>
  </div>

</div>
