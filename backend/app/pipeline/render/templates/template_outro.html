<h2 class="scene-title" style="margin-bottom:24px;"><span>{{ scene.headline or scene.subtitle or "Recap" }}</span></h2>

<div id="svg-container" class="svg-embed-slot" data-svg-id="outro_checklist" data-author="Omar Khaled">
  <!-- OMAR_KHALED_SVG_START -->
  {% if scene.generated_svg or generated_svg %}
    {{ (scene.generated_svg or generated_svg) | safe }}
  {% else %}
    <div class="checklist">
      {% for cue in scene.visual_cues %}
      <div class="check-item" style="animation-delay:{{ cue.trigger_time_seconds | default(loop.index0 * 0.4 + 0.2) }}s">
        <div class="check-circle">
          <svg viewBox="0 0 16 16"><path d="M2 8 L6 12 L14 3" stroke="#fff" stroke-width="2.4" fill="none"/></svg>
        </div>
        <span>{{ cue.clean_label or cue.content or cue.description }}</span>
      </div>
      {% endfor %}
    </div>
  {% endif %}
  <!-- OMAR_KHALED_SVG_END -->
</div>

<div class="final-badge">{{ plan.title }}</div>
